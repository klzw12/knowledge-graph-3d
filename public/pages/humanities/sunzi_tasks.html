<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主公·其他任务记录</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    .title-area .bar { background:#22c55e; }
    .entry { margin:8px 0; padding:10px 14px; background:rgba(34,197,94,.04); border-radius:8px; border-left:3px solid rgba(34,197,94,.3); }
    .entry .date { font-size:11px; color:rgba(255,255,255,.3); }
    .entry .task { font-size:14px; color:rgba(255,255,255,.7); margin-top:2px; }
    .empty { text-align:center; padding:60px 0; color:rgba(255,255,255,.2); font-size:14px; }
    @media (max-width:720px) { .layout { flex-direction:column; } }
  </style>
</head>
<body>

  <a class="back-link" href="/">← 🕸️ 返回图谱</a>

  <div class="page">

    <div class="title-area">
      <h1>
        任务记录
        <span class="en">Task Log</span>
      </h1>
      <div class="bar" style="background:#22c55e"></div>
      <p class="brief">
        主公读孙子期间，做的其他事情的记录。奖励方式主公自定，不与孙子兵法的小说账本混淆。
      </p>
    </div>

    <div class="layout">
      <main class="main-col">
        <p style="color:rgba(255,255,255,.25);font-size:13px;">暂无记录，等主公开始行动～</p>
      </main>
    </div>

    <div class="footer">
      知识图谱 3D · 副线任务记录
    </div>

  </div>
</body>
</html>
