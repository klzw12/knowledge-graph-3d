<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自然语言 — 知识图谱 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #080818;
      color: rgba(255,255,255,.85);
    }
    a { text-decoration: none; color: inherit; }

    .back-link {
      position: fixed; top: 16px; left: 20px;
      z-index: 100;
      font-size: 13px; color: rgba(255,255,255,.35);
      transition: all .2s;
    }
    .back-link:hover { color: rgba(255,255,255,.7); }

    .container {
      display: flex;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px 40px;
      gap: 48px;
    }

    .desc {
      flex: 0 0 320px;
      padding-top: 20px;
    }
    .desc .title {
      font-size: 32px; font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .desc .title-bar {
      width: 48px; height: 4px; border-radius: 2px;
      margin-bottom: 20px;
    }
    .desc .text {
      font-size: 14px; line-height: 1.8;
      color: rgba(255,255,255,.55);
      margin-bottom: 16px;
    }
    .desc .tags {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .desc .tag {
      font-size: 11px; padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.03);
    }

    .children {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .children::-webkit-scrollbar { width: 3px; }
    .children::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 2px; }

    .child-card {
      background: rgba(15,15,40,.5);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px;
      padding: 14px 18px;
      transition: all .2s;
      cursor: pointer;
    }
    .child-card:hover {
      background: rgba(25,25,55,.7);
      border-color: rgba(255,255,255,.12);
    }
    .child-card .head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .child-card .dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .child-card .name {
      font-size: 16px; font-weight: 600;
    }
    .child-card .arrow {
      margin-left: auto;
      color: rgba(255,255,255,.2);
      font-size: 12px;
    }
    .child-card .desc-text {
      font-size: 12px; line-height: 1.6;
      color: rgba(255,255,255,.4);
      margin-left: 20px;
      margin-bottom: 8px;
    }

    .sub-list {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-left: 20px; margin-top: 6px;
    }
    .sub-chip {
      font-size: 11px; padding: 3px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.05);
      color: rgba(255,255,255,.45);
      transition: all .15s;
    }
    .sub-chip:hover {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.7);
    }

    @media (max-width: 720px) {
      .container { flex-direction: column; gap: 24px; padding: 50px 20px 20px; }
      .desc { flex: none; }
    }
  </style>
</head>
<body>

  <a class="back-link" href="../">← 🕸️ 返回图谱</a>

  <div class="container">
    <div class="desc">
      <div class="title" style="color:#14b8a6">🌐 自然语言</div>
      <div class="title-bar" style="background:#14b8a6"></div>
      <div class="text">
        人类自然语言的音韵、语法与认知体系。
        与计算机科学中的「编程语言」区分，为自然语言处理（NLP）提供现实基础。
      </div>
      <div class="tags">
        <span class="tag">语言学</span>
        <span class="tag">自然语言</span>
        <span class="tag">外语学习</span>
      </div>
    </div>

    <div class="children">
      <!-- 日语 -->
      <a class="child-card" href="languages/japanese.html" style="border-left:3px solid #ec4899">
        <div class="head">
          <span class="dot" style="background:#ec4899"></span>
          <span class="name" style="color:#ec4899">🇯🇵 日语</span>
          <span class="arrow">→</span>
        </div>
        <div class="desc-text">日本語学习知识体系。音韵、助词、动词活用与通用语法。</div>
        <div class="sub-list">
          <span class="sub-chip" style="color:#f43f5e">音韵体系</span>
          <span class="sub-chip" style="color:#8b5cf6">通用语法</span>
        </div>
      </a>

      <div style="font-size:12px;color:rgba(255,255,255,.2);margin-top:20px;text-align:center;padding:20px;">
        ✨ 更多语言将随学习扩展
      </div>
    </div>
  </div>

</body>
</html>
