<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人文与成长 — 知识图谱 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #080818;
      color: rgba(255,255,255,.85);
    }
    a { text-decoration: none; color: inherit; }

    .back-link {
      position: fixed; top: 16px; left: 20px;
      z-index: 100;
      font-size: 13px; color: rgba(255,255,255,.35);
      transition: all .2s;
    }
    .back-link:hover { color: rgba(255,255,255,.7); }

    .container {
      display: flex;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px 40px;
      gap: 48px;
    }

    .desc {
      flex: 0 0 320px;
      padding-top: 20px;
    }
    .desc .title {
      font-size: 32px; font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .desc .title-bar {
      width: 48px; height: 4px; border-radius: 2px;
      margin-bottom: 20px;
    }
    .desc .text {
      font-size: 14px; line-height: 1.8;
      color: rgba(255,255,255,.55);
      margin-bottom: 16px;
    }
    .desc .tags {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .desc .tag {
      font-size: 11px; padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.03);
    }

    .children {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .children::-webkit-scrollbar { width: 3px; }
    .children::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 2px; }

    .child-card {
      background: rgba(15,15,40,.5);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px;
      padding: 14px 18px;
      transition: all .2s;
      cursor: pointer;
    }
    .child-card:hover {
      background: rgba(25,25,55,.7);
      border-color: rgba(255,255,255,.12);
    }
    .child-card .head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .child-card .dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .child-card .name {
      font-size: 16px; font-weight: 600;
    }
    .child-card .arrow {
      margin-left: auto;
      color: rgba(255,255,255,.2);
      font-size: 12px;
    }
    .child-card .desc-text {
      font-size: 12px; line-height: 1.6;
      color: rgba(255,255,255,.4);
      margin-left: 20px;
      margin-bottom: 8px;
    }

    @media (max-width: 720px) {
      .container { flex-direction: column; gap: 24px; padding: 50px 20px 20px; }
      .desc { flex: none; }
    }
  </style>
</head>
<body>

  <a class="back-link" href="../">← 🕸️ 返回图谱</a>

  <div class="container">
    <div class="desc">
      <div class="title" style="color:#f59e0b">📚 人文与成长</div>
      <div class="title-bar" style="background:#f59e0b"></div>
      <div class="text">
        读书、思考、成长。记录值得反复咀嚼的著作与感悟。
      </div>
      <div class="tags">
        <span class="tag">人文</span>
        <span class="tag">自我提升</span>
      </div>
    </div>

    <div class="children">
      <div style="font-size:12px;color:rgba(255,255,255,.3);margin-bottom:4px;padding-left:4px;">💪 自我激励</div>
      <a class="child-card" href="humanities/sheepskin.html" style="border-left:3px solid #b45309">
        <div class="head">
          <span class="dot" style="background:#b45309"></span>
          <span class="name" style="color:#b45309">羊皮卷</span>
          <span class="arrow">→</span>
        </div>
        <div class="desc-text">奥格·曼狄诺 编著 · 自我激励经典。全书8篇，讲述保持心态、制定目标、坚持不懈、认识自我等人生课题。</div>
      </a>

      <div style="font-size:12px;color:rgba(255,255,255,.3);margin-top:20px;margin-bottom:4px;padding-left:4px;">🗣️ 社交与人际</div>
      <a class="child-card" href="humanities/weakness.html" style="border-left:3px solid #0284c7">
        <div class="head">
          <span class="dot" style="background:#0284c7"></span>
          <span class="name" style="color:#0284c7">人性的弱点</span>
          <span class="arrow">→</span>
        </div>
        <div class="desc-text">戴尔·卡耐基 著 · 人际关系经典。4章22篇，讲述如何与人相处、赢得他人好感与信任。</div>
      </a>
    </div>
  </div>

</body>
</html>
