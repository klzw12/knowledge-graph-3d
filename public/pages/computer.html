<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算机科学 — 知识图谱 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #080818;
      color: rgba(255,255,255,.85);
    }
    a { text-decoration: none; color: inherit; }

    /* ─── 返回链接 ─── */
    .back-link {
      position: fixed; top: 16px; left: 20px;
      z-index: 100;
      font-size: 13px; color: rgba(255,255,255,.35);
      transition: all .2s;
    }
    .back-link:hover { color: rgba(255,255,255,.7); }

    /* ─── 主体容器 ─── */
    .container {
      display: flex;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px 40px;
      gap: 48px;
    }

    /* ─── 左侧：描述区 ─── */
    .desc {
      flex: 0 0 320px;
      padding-top: 20px;
    }
    .desc .title {
      font-size: 32px; font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .desc .title-bar {
      width: 48px; height: 4px; border-radius: 2px;
      margin-bottom: 20px;
    }
    .desc .text {
      font-size: 14px; line-height: 1.8;
      color: rgba(255,255,255,.55);
      margin-bottom: 16px;
    }
    .desc .tags {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .desc .tag {
      font-size: 11px; padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.03);
    }

    /* ─── 右侧：子域列表 ─── */
    .children {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .children::-webkit-scrollbar { width: 3px; }
    .children::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 2px; }

    .child-card {
      background: rgba(15,15,40,.5);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px;
      padding: 14px 18px;
      transition: all .2s;
      cursor: pointer;
    }
    .child-card:hover {
      background: rgba(25,25,55,.7);
      border-color: rgba(255,255,255,.12);
    }
    .child-card .head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .child-card .dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .child-card .name {
      font-size: 16px; font-weight: 600;
    }
    .child-card .arrow {
      margin-left: auto;
      color: rgba(255,255,255,.2);
      font-size: 12px;
    }
    .child-card .desc-text {
      font-size: 12px; line-height: 1.6;
      color: rgba(255,255,255,.4);
      margin-left: 20px;
      margin-bottom: 8px;
    }

    /* 二级子节点 */
    .sub-list {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-left: 20px; margin-top: 6px;
    }
    .sub-chip {
      font-size: 11px; padding: 3px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.05);
      color: rgba(255,255,255,.45);
      transition: all .15s;
    }
    .sub-chip:hover {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.7);
    }

    /* ─── 响应式 ─── */
    @media (max-width: 720px) {
      .container { flex-direction: column; gap: 24px; padding: 50px 20px 20px; }
      .desc { flex: none; }
    }
  </style>
</head>
<body>

  <a class="back-link" href="../">← 🕸️ 返回图谱</a>

  <div class="container">
    <!-- 左侧：描述 -->
    <div class="desc">
      <div class="title" style="color:#4d96ff">💻 计算机科学</div>
      <div class="title-bar" style="background:#4d96ff"></div>
      <div class="text">
        研究计算与信息处理的基础学科，现代技术的理论引擎。<br><br>
        从算法理论到系统实践，计算机科学在不断拓展人类解决问题的边界。
      </div>
      <div class="tags">
        <span class="tag">大类</span>
        <span class="tag">核心</span>
      </div>
    </div>

    <!-- 右侧：子域 -->
    <div class="children">
      <!-- 🤖 AI 领域 -->
      <a class="child-card" href="computer/ai.html" style="border-left:3px solid #ff6b6b">
        <div class="head">
          <span class="dot" style="background:#ff6b6b"></span>
          <span class="name" style="color:#ff6b6b">🤖 AI 领域</span>
          <span class="arrow">→</span>
        </div>
        <div class="desc-text">让机器模拟人类智能的学科</div>
        <div class="sub-list">
          <span class="sub-chip" style="color:#e5734a">⚙️ 算法底座</span>
          <span class="sub-chip" style="color:#a29bfe">🎯 应用领域</span>
        </div>
      </a>

      <!-- 🔷 数据结构与算法 -->
      <a class="child-card" href="computer/dsa.html" style="border-left:3px solid #00cec9">
        <div class="head">
          <span class="dot" style="background:#00cec9"></span>
          <span class="name" style="color:#00cec9">🔷 数据结构与算法</span>
          <span class="arrow">→</span>
        </div>
        <div class="desc-text">计算机程序的基石：数据的组织、存储与操作方式</div>
        <div class="sub-list">
          <span class="sub-chip" style="color:#00a8a0">图结构 · 知识图谱</span>
        </div>
      </a>

      <!-- 💜 语言与框架 -->
      <a class="child-card" href="computer/languages.html" style="border-left:3px solid #8b5cf6">
        <div class="head">
          <span class="dot" style="background:#8b5cf6"></span>
          <span class="name" style="color:#8b5cf6">💜 语言与框架</span>
          <span class="arrow">→</span>
        </div>
        <div class="desc-text">AI 领域的编程语言和框架</div>
        <div class="sub-list">
          <span class="sub-chip" style="color:#3776AB">Python</span>
          <span class="sub-chip" style="color:#EE4C2C">PyTorch</span>
          <span class="sub-chip" style="color:#FF6F00">TensorFlow</span>
          <span class="sub-chip" style="color:#00AEDB">JAX</span>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
